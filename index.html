<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    /* Base styles */
    body {
      background: linear-gradient(to bottom, #0f0f1a, #1a1a2e);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glass card effect */
    .glass-card {
      background-color: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border-radius: 0.75rem;
      overflow: hidden;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Form elements */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.8);
    }

    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      box-sizing: border-box;
    }

    input[type="color"] {
      width: 40px;
      height: 40px;
      border: none;
      background: none;
    }

    .color-input {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-input input[type="text"] {
      flex: 1;
    }

    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }

    /* Button styles */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(to right, #8b5cf6, #ec4899);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(to right, #7c3aed, #db2777);
    }

    .btn-secondary {
      background: linear-gradient(to right, #3b82f6, #8b5cf6);
      color: white;
    }

    .btn-secondary:hover {
      background: linear-gradient(to right, #2563eb, #7c3aed);
    }

    .btn-block {
      display: block;
      width: 100%;
    }

    /* QR code container */
    .qr-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      padding: 20px;
      position: relative;
      border-radius: 12px;
    }

    .qr-container::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(to bottom right, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2));
      filter: blur(8px);
      z-index: -1;
    }

    /* Title */
    .title {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(to right, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 28px;
      font-weight: bold;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }

    .footer-text {
      margin-bottom: 10px;
    }

    .gradient-text {
      background: linear-gradient(to right, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.1);
      transition: background-color 0.3s;
    }

    .social-link:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <div style="padding: 20px;">
        <h1 class="title">QR Code Generator</h1>
        
        <form id="qrForm">
          <div class="form-group">
            <label for="url">URL</label>
            <input type="url" id="url" value="https://instagram.com/yaxsarhane" placeholder="Enter a URL" required>
          </div>
          
          <div class="form-group">
            <label for="color">QR Code Color</label>
            <div class="color-input">
              <input type="color" id="color" value="#ffffff">
              <input type="text" id="colorText" value="#ffffff">
            </div>
          </div>
          
          <div class="form-group">
            <label for="backgroundColor">Background Color</label>
            <div class="color-input">
              <input type="color" id="backgroundColor" value="#000000">
              <input type="text" id="backgroundColorText" value="#000000">
            </div>
            
            <div style="margin-top: 10px;">
              <input type="checkbox" id="transparentBg" style="margin-right: 5px;">
              <label for="transparentBg" style="display: inline;">Transparent Background</label>
            </div>
          </div>
          
          <div class="form-group">
            <label for="size">Size: <span id="sizeValue">200</span>x<span id="sizeValue2">200</span></label>
            <input type="range" id="size" min="100" max="400" step="10" value="200">
          </div>
          
          <div class="form-group">
            <label for="errorCorrection">Error Correction Level</label>
            <select id="errorCorrection">
              <option value="L">Low (7%)</option>
              <option value="M" selected>Medium (15%)</option>
              <option value="Q">Quartile (25%)</option>
              <option value="H">High (30%)</option>
            </select>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block">Generate QR Code</button>
        </form>
        
        <div id="qrContainer" class="qr-container hidden">
          <div id="qrCode"></div>
        </div>
        
        <button id="downloadBtn" class="btn btn-secondary btn-block hidden">
          Download PNG
        </button>
      </div>
    </div>
  </div>
  
  <footer>

  <script>
    // DOM Elements
    const form = document.getElementById('qrForm');
    const urlInput = document.getElementById('url');
    const colorInput = document.getElementById('color');
    const colorTextInput = document.getElementById('colorText');
    const backgroundColorInput = document.getElementById('backgroundColor');
    const backgroundColorTextInput = document.getElementById('backgroundColorText');
    const transparentBgCheckbox = document.getElementById('transparentBg');
    const sizeInput = document.getElementById('size');
    const sizeValueSpan = document.getElementById('sizeValue');
    const sizeValueSpan2 = document.getElementById('sizeValue2');
    const errorCorrectionSelect = document.getElementById('errorCorrection');
    const qrContainer = document.getElementById('qrContainer');
    const qrCodeDiv = document.getElementById('qrCode');
    const downloadBtn = document.getElementById('downloadBtn');
    
    // Sync color inputs
    colorInput.addEventListener('input', () => {
      colorTextInput.value = colorInput.value;
    });
    
    colorTextInput.addEventListener('input', () => {
      colorInput.value = colorTextInput.value;
    });
    
    backgroundColorInput.addEventListener('input', () => {
      backgroundColorTextInput.value = backgroundColorInput.value;
    });
    
    backgroundColorTextInput.addEventListener('input', () => {
      backgroundColorInput.value = backgroundColorTextInput.value;
    });
    
    // Toggle background color inputs based on transparent checkbox
    transparentBgCheckbox.addEventListener('change', () => {
      const isDisabled = transparentBgCheckbox.checked;
      backgroundColorInput.disabled = isDisabled;
      backgroundColorTextInput.disabled = isDisabled;
    });
    
    // Update size value display
    sizeInput.addEventListener('input', () => {
      sizeValueSpan.textContent = sizeInput.value;
      sizeValueSpan2.textContent = sizeInput.value;
    });
    
    // Generate QR Code
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const url = urlInput.value;
      const color = colorInput.value;
      const backgroundColor = transparentBgCheckbox.checked ? 'transparent' : backgroundColorInput.value;
      const size = parseInt(sizeInput.value);
      const errorCorrectionLevel = errorCorrectionSelect.value;
      
      // Clear previous QR code
      qrCodeDiv.innerHTML = '';
      
      // Generate QR code
      const qrcode = new QRCode(qrCodeDiv, {
        text: url,
        width: size,
        height: size,
        colorDark: color,
        colorLight: backgroundColor === 'transparent' ? '#ffffff00' : backgroundColor,
        correctLevel: QRCode.CorrectLevel[errorCorrectionLevel]
      });
      
      // Show QR code container and download button
      qrContainer.classList.remove('hidden');
      downloadBtn.classList.remove('hidden');
    });
    
    // Download QR Code
    downloadBtn.addEventListener('click', () => {
      const canvas = qrCodeDiv.querySelector('canvas');
      if (!canvas) return;
      
      // If background is transparent and we're downloading, we need to handle it specially
      if (transparentBgCheckbox.checked) {
        // Create a new canvas with the same dimensions
        const downloadCanvas = document.createElement('canvas');
        downloadCanvas.width = canvas.width;
        downloadCanvas.height = canvas.height;
        
        const ctx = downloadCanvas.getContext('2d');
        // Make sure the background is transparent
        ctx.clearRect(0, 0, downloadCanvas.width, downloadCanvas.height);
        // Draw the original canvas onto our new one
        ctx.drawImage(canvas, 0, 0);
        
        // Convert to PNG and download
        const pngUrl = downloadCanvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'qrcode.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      } else {
        // For non-transparent backgrounds, we can download directly
        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'qrcode.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      }
    });
    
    // Initialize with default QR code
    window.addEventListener('load', () => {
      form.dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
